:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#e9edf5;background:#0b0e15}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#536cff;color:white;padding:10px 14px}button:hover{filter:brightness(1.12)}button.ghost{background:#252c3c}button.danger{background:#82384b}input,select,textarea{background:#151b28;color:#fff;border:1px solid #374052;border-radius:9px;padding:10px;width:100%}textarea{min-height:80px}label{font-size:13px;color:#b7c1d4;display:block;margin-bottom:5px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#101521;border-right:1px solid #263043;padding:24px 15px}.brand{font-weight:900;font-size:25px;letter-spacing:2px;margin:0 8px 30px}.brand small{font-size:10px;display:block;letter-spacing:3px;color:#8794ae}.nav{display:block;width:100%;text-align:left;background:transparent;margin:5px 0;color:#b9c5da}.nav.active{background:#263459;color:white}.main{max-width:1150px;width:100%;padding:30px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}.top h1{margin:0;font-size:27px}.muted{color:#9aa8bf;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #293346;border-radius:16px;background:#141b29;padding:18px;margin-bottom:14px}.card h3{margin:0 0 12px}.metric{font-size:29px;font-weight:800}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.pill{font-size:11px;background:#27334a;color:#c7d5f0;border-radius:20px;padding:5px 9px}.warn{color:#f2c36b}.good{color:#69d6a0}.field{margin-bottom:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:12px 0;border-bottom:1px solid #283247}.item:last-child{border-bottom:0}.hidden{display:none}.schedule{display:grid;grid-template-columns:55px repeat(7,minmax(32px,1fr));gap:3px;overflow:auto}.cell{height:29px;border-radius:5px;padding:0;min-width:30px}.free{background:#238c68}.maybe{background:#b8862c}.busy{background:#394354}.headcell{font-size:11px;text-align:center;padding-top:6px;color:#aab7ce}.seg{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}.seg button{font-size:12px}.selected{outline:2px solid white}.toast{position:fixed;bottom:18px;right:18px;background:#233654;border:1px solid #5d7195;border-radius:10px;padding:12px;display:none;max-width:320px}a{color:#9fb0ff}@media(max-width:700px){.shell{display:block}.sidebar{padding:12px;position:sticky;top:0;z-index:2}.brand{margin:0 0 8px;font-size:18px}.brand small{display:none}.links{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;font-size:12px;padding:9px}.main{padding:17px}.top h1{font-size:23px}.two,.three{grid-template-columns:1fr}}

/* Mobile-first app shell enhancements */

</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">AEROCK<small>BAND MANAGEMENT</small></div><div class="links" id="nav"></div></aside><main class="main"><div class="top"><h1 id="heading">홈</h1><div class="row"><select id="userSelect" style="width:170px" aria-label="현재 사용자"></select><button class="ghost" onclick="exportData()">백업</button></div></div><div id="content"><div class="card"><h3>모바일 실행 안내</h3><p>이 화면이 계속 표시된다면 아이폰 파일 미리보기에서 스크립트가 차단된 상태입니다.</p><p>웹사이트를 Safari에서 HTTPS 주소로 열어야 모든 기능을 사용할 수 있습니다.</p><p class="muted">배포 전에는 데이터가 다른 부원과 공유되지 않습니다.</p></div></div></main></div><nav class="bottom-nav" id="mobileNav" aria-label="모바일 메뉴"><span style="padding:12px">AEROCK · 모바일 웹 실행 준비 중</span></nav><div class="toast" id="toast"></div><script>
const K='aerock_mvp_1';const days=['월','화','수','목','금','토','일'];const parts=['보컬','기타','베이스','드럼','키보드','기타2'];const initial={users:[{id:'u1',name:'운영진',group:1,part:'기타',role:'admin'},{id:'u2',name:'민지',group:1,part:'보컬',role:'member'},{id:'u3',name:'준호',group:1,part:'드럼',role:'member'},{id:'u4',name:'서연',group:2,part:'키보드',role:'member'}],shows:[{id:'show1',name:'정기공연',quota:20}],songs:[{id:'s1',title:'샘플 록 곡',artist:'AEROCK',group:1,mode:'조',owner:'u1',status:'후보',parts:['보컬','기타','베이스','드럼'],members:['u1'],votes:[]},{id:'s2',title:'샘플 프리폼 곡',artist:'AEROCK',group:0,mode:'프리폼',owner:'u2',status:'모집',parts:['보컬','기타','베이스','드럼','키보드'],members:['u2'],votes:[]}],rooms:[{id:'r1',name:'제1합주실'},{id:'r2',name:'제2합주실'}],bookings:[],slots:{},exceptions:{},current:'u1'};let db;try{db=JSON.parse(localStorage.getItem(K))||JSON.parse(JSON.stringify(initial))}catch(e){db=JSON.parse(JSON.stringify(initial))};let page='home',paint='free',scheduleUser=null;const $=id=>document.getElementById(id),me=()=>db.users.find(u=>u.id===db.current),isAdmin=()=>me().role==='admin',uid=()=>Math.random().toString(36).slice(2,10),save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){console.warn('기기 미리보기 저장 제한:',e)}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),notify=s=>{let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3000)},fmt=d=>new Date(d).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}),person=id=>db.users.find(u=>u.id===id)?.name||'미등록';function go(p){page=p;render()}function render(){const tabs=[['home','⌂ 홈'],['songs','♫ 곡 선정'],['sessions','♬ 세션'],['schedule','▦ 시간표'],['practice','◷ 합주 추천'],['rooms','▣ 합주실'],['admin','⚙ 운영']];$('nav').innerHTML=tabs.filter(t=>t[0]!=='admin'||isAdmin()).map(t=>`<button class="nav ${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('mobileNav').innerHTML=tabs.filter(t=>t[0]!=='admin'||isAdmin()).map(t=>`<button class="mobile-tab ${page===t[0]?'active':''}" onclick="go('${t[0]}')"><span class="mobile-icon">${({home:'⌂',songs:'♫',sessions:'♬',schedule:'▦',practice:'◷',rooms:'▣',admin:'⚙'})[t[0]]}</span><span>${({home:'홈',songs:'곡',sessions:'세션',schedule:'시간표',practice:'합주',rooms:'합주실',admin:'운영'})[t[0]]}</span></button>`).join('');$('userSelect').innerHTML=db.users.map(u=>`<option value="${u.id}" ${u.id===db.current?'selected':''}>${esc(u.name)} (${u.role==='admin'?'운영진':u.group+'조'})</option>`).join('');$('userSelect').onchange=e=>{db.current=e.target.value;save();render()};$('heading').textContent=Object.fromEntries(tabs)[page]||'홈';$('content').innerHTML=({home,songs,sessions,schedule,practice,rooms,admin})[page]();}
function home(){const mine=db.songs.filter(s=>s.members.includes(db.current));return `<div class="grid"><div class="card"><div class="muted">공연곡</div><div class="metric">${db.songs.length}</div></div><div class="card"><div class="muted">내 참여곡</div><div class="metric">${mine.length}</div></div><div class="card"><div class="muted">예약 요청</div><div class="metric">${db.bookings.filter(b=>b.status==='대기').length}</div></div></div><div class="card"><h3>내 곡</h3>${mine.length?mine.map(s=>`<div class="item">${esc(s.title)} <span class="pill">${esc(s.status)}</span></div>`).join(''):'참여 중인 곡이 없습니다.'}</div><div class="card"><h3>시작하기</h3><p class="muted">상단 사용자 선택으로 부원 계정을 전환해 기능을 시험할 수 있습니다. 이 버전은 브라우저에만 저장되는 데모이며 실제 인증 기능은 없습니다.</p><div class="row"><button onclick="go('songs')">곡 신청</button><button onclick="go('schedule')">시간표 입력</button><button onclick="go('rooms')">합주실 예약</button></div></div>`}
function songs(){let visible=db.songs.filter(s=>s.mode==='프리폼'||s.group===me().group||isAdmin());return `<div class="card"><h3>새 곡 등록</h3><form onsubmit="addSong(event)"><div class="two"><div class="field"><label>곡명</label><input name="title" required maxlength="100"></div><div class="field"><label>아티스트</label><input name="artist" required maxlength="100"></div></div><div class="two"><div class="field"><label>선정 방식</label><select name="mode"><option>조</option><option>프리폼</option></select></div><div class="field"><label>필요 세션 (쉼표로 구분)</label><input name="parts" value="보컬,기타,베이스,드럼" required></div></div><button>곡 등록</button></form></div><div class="card"><h3>후보곡 · 프리폼</h3>${visible.map(s=>`<div class="item"><div class="row between"><b>${esc(s.title)}</b><span class="pill">${s.mode==='조'?s.group+'조':'프리폼'} · ${esc(s.status)}</span></div><p class="muted">${esc(s.artist)} · 필요 ${s.parts.map(esc).join(', ')} · ${s.votes.length}표</p><div class="row">${s.mode==='조'&&s.status==='후보'&&s.group===me().group?`<button onclick="vote('${s.id}')" class="ghost">${s.votes.includes(db.current)?'투표 취소':'투표'} (${s.votes.length})</button>`:''}${(isAdmin()||s.owner===db.current)?`<select style="width:130px" onchange="setSongStatus('${s.id}',this.value)">${['후보','모집','확정','보류'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select>`:''}</div></div>`).join('')||'등록된 곡이 없습니다.'}</div>`}
function addSong(e){e.preventDefault();const f=new FormData(e.target),mode=f.get('mode');db.songs.push({id:uid(),title:f.get('title').trim(),artist:f.get('artist').trim(),mode,group:mode==='조'?me().group:0,owner:db.current,status:mode==='조'?'후보':'모집',parts:f.get('parts').split(',').map(x=>x.trim()).filter(Boolean),members:[db.current],votes:[]});save();render();notify('곡을 등록했습니다')}
function vote(id){let s=db.songs.find(x=>x.id===id);if(!s||s.group!==me().group)return;const i=s.votes.indexOf(db.current);if(i>=0)s.votes.splice(i,1);else{let count=db.songs.filter(x=>x.mode==='조'&&x.group===me().group&&x.votes.includes(db.current)).length;if(count>=3)return notify('조별 최대 3곡까지 투표할 수 있습니다');s.votes.push(db.current)}save();render()}
function setSongStatus(id,status){let s=db.songs.find(x=>x.id===id);if(isAdmin()||s.owner===db.current){s.status=status;save();render()}}
function sessions(){return `<div class="card"><h3>곡별 세션 모집</h3>${db.songs.filter(s=>s.status!=='보류').map(s=>`<div class="item"><b>${esc(s.title)}</b> <span class="pill">${esc(s.status)}</span><p class="muted">참여: ${s.members.map(person).map(esc).join(', ')}</p><div class="row">${s.parts.map(p=>`<span class="pill">${esc(p)} ${s.members.some(id=>db.users.find(u=>u.id===id)?.part===p)?'✓':'모집 중'}</span>`).join('')}</div><div class="row" style="margin-top:10px">${s.members.includes(db.current)?`<button class="ghost" onclick="joinSong('${s.id}',false)">참여 취소</button>`:`<button onclick="joinSong('${s.id}',true)">내 파트로 지원</button>`}</div></div>`).join('')}</div>`}function joinSong(id,on){let s=db.songs.find(x=>x.id===id);s.members=s.members.filter(x=>x!==db.current);if(on)s.members.push(db.current);save();render()}
function slotKey(user,d,h){return `${user}_${d}_${h}`}function schedule(){let u=scheduleUser||db.current;if(!isAdmin())u=db.current;let cells='';for(let h=10;h<24;h++){cells+=`<div class="headcell">${h}:00</div>`;for(let d=0;d<7;d++){let val=db.slots[slotKey(u,d,h)]||'busy';cells+=`<button title="${days[d]} ${h}시" class="cell ${val}" onclick="setSlot('${u}',${d},${h})"></button>`}}return `<div class="card"><h3>기본 주간 시간표</h3><p class="muted">1시간 단위 · 언제든 수정 가능 · 변경 즉시 저장</p>${isAdmin()?`<div class="field"><label>편집 대상</label><select onchange="scheduleUser=this.value;render()">${db.users.map(x=>`<option value="${x.id}" ${u===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="seg">${[['free','가능'],['maybe','조정 가능'],['busy','불가능']].map(([k,v])=>`<button class="${k} ${paint===k?'selected':''}" onclick="paint='${k}';render()">${v}</button>`).join('')}</div><div class="schedule"><div></div>${days.map(x=>`<div class="headcell">${x}</div>`).join('')}${cells}</div></div><div class="card"><h3>특정 날짜 예외</h3><form onsubmit="addException(event)"><input type="hidden" name="user" value="${u}"><div class="three"><div class="field"><label>날짜</label><input type="date" name="date" required></div><div class="field"><label>시작 시각</label><input type="time" name="start" value="18:00" required></div><div class="field"><label>종료 시각</label><input type="time" name="end" value="20:00" required></div></div><div class="field"><label>가능 여부</label><select name="state"><option value="free">가능</option><option value="maybe">조정 가능</option><option value="busy">불가능</option></select></div><button>예외 등록</button></form><div class="muted">${Object.entries(db.exceptions).filter(([k,v])=>v.user===u).map(([k,v])=>`<div class="item">${esc(v.date)} ${esc(v.start)}~${esc(v.end)} · ${esc(v.state)} <button class="ghost" onclick="deleteException('${k}')">삭제</button></div>`).join('')}</div></div>`}
function setSlot(u,d,h){db.slots[slotKey(u,d,h)]=paint;save();render()}function addException(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.start>=v.end)return notify('종료 시각을 확인하세요');db.exceptions[uid()]=v;save();render()}function deleteException(k){delete db.exceptions[k];save();render()}
function stateAt(user,dt){let d=new Date(dt),date=dt.slice(0,10),time=dt.slice(11,16);let ex=Object.values(db.exceptions).filter(v=>v.user===user&&v.date===date&&v.start<=time&&v.end>time).slice(-1)[0];return ex?.state||db.slots[slotKey(user,(d.getDay()+6)%7,d.getHours())]||'busy'}
function roomBusy(room,start,end){return db.bookings.some(b=>b.room===room&&b.status==='확정'&&start<b.end&&end>b.start)}
function practice(){return `<div class="card"><h3>합주 시간 추천</h3><p class="muted">필수 세션은 곡에 등록된 드럼·베이스 담당자로 가정한 MVP 규칙입니다. 조정 가능 시간은 확정 참석으로 취급하지 않습니다.</p><form onsubmit="recommend(event)"><div class="two"><div class="field"><label>곡</label><select name="song">${db.songs.filter(s=>s.members.includes(db.current)||isAdmin()).map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>기준 날짜</label><input type="date" name="date" required></div><div class="field"><label>합주 길이</label><select name="duration"><option value="2">2시간</option><option value="1">1시간</option><option value="3">3시간</option></select></div><div class="field"><label>합주실</label><select name="room">${db.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div><button>7일간 가능한 시간 찾기</button></form></div><div id="recommendations"></div>`}
function recommend(e){e.preventDefault();const f=new FormData(e.target),s=db.songs.find(x=>x.id===f.get('song')),room=f.get('room'),duration=+f.get('duration');let results=[];for(let day=0;day<7;day++)for(let h=10;h<=23-duration;h++){let base=new Date(f.get('date')+'T00:00:00');base.setDate(base.getDate()+day);base.setHours(h);let start=localISO(base),end=localISO(new Date(base.getTime()+duration*3600000));if(roomBusy(room,start,end))continue;let statuses=s.members.map(id=>({id,state:stateAt(id,start)}));let essential=statuses.filter(x=>['드럼','베이스'].includes(db.users.find(u=>u.id===x.id)?.part));let free=statuses.filter(x=>x.state==='free').length,maybe=statuses.filter(x=>x.state==='maybe').length;let blocked=essential.some(x=>x.state==='busy');results.push({start,end,free,maybe,blocked,score:(blocked?-100:0)+free*10+maybe*3})}results.sort((a,b)=>b.score-a.score||a.start.localeCompare(b.start));$('recommendations').innerHTML=`<div class="card"><h3>추천 결과 (상위 8개)</h3>${results.slice(0,8).map(r=>`<div class="item"><div class="row between"><b>${fmt(r.start)}</b><span class="pill ${r.blocked?'warn':'good'}">${r.blocked?'필수 파트 확인 필요':'필수 파트 충족'}</span></div><p class="muted">가능 ${r.free}/${s.members.length} · 조정 가능 ${r.maybe}명 · ${duration}시간</p><button onclick="requestBooking('${s.id}','${room}','${r.start}','${r.end}')">이 시간 예약 요청</button></div>`).join('')||'가능한 시간이 없습니다.'}</div>`}
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function requestBooking(song,room,start,end){if(start>=end)return notify('시간을 확인하세요');if(roomBusy(room,start,end))return notify('이미 확정된 예약과 겹칩니다');db.bookings.push({id:uid(),song,room,start,end,owner:db.current,status:'대기'});save();notify('예약 요청이 등록되었습니다. 운영진이 우선순위를 조정합니다.');go('rooms')}
function rooms(){return `<div class="card"><h3>합주실 예약 신청</h3><p class="muted">모든 부원이 신청할 수 있습니다. 예약은 운영진 승인 후 확정됩니다.</p><form onsubmit="bookRoom(event)"><div class="two"><div class="field"><label>곡</label><select name="song">${db.songs.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>합주실</label><select name="room">${db.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>시작</label><input name="start" type="datetime-local" required></div><div class="field"><label>종료</label><input name="end" type="datetime-local" required></div></div><button>예약 신청</button></form></div><div class="card"><h3>예약 현황</h3>${db.bookings.sort((a,b)=>a.start.localeCompare(b.start)).map(b=>`<div class="item"><div class="row between"><b>${esc(db.rooms.find(r=>r.id===b.room)?.name)}</b><span class="pill">${esc(b.status)}</span></div><p class="muted">${esc(db.songs.find(s=>s.id===b.song)?.title)} · ${fmt(b.start)} ~ ${fmt(b.end)} · 신청 ${esc(person(b.owner))}</p><div class="row">${isAdmin()&&b.status==='대기'?`<button onclick="approve('${b.id}')">승인</button><button class="ghost" onclick="reject('${b.id}')">반려</button>`:''}${(b.owner===db.current||isAdmin())&&b.status!=='취소'?`<button class="danger" onclick="cancel('${b.id}')">취소</button>`:''}</div></div>`).join('')||'예약 내역이 없습니다.'}</div>`}
function bookRoom(e){e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(start>=end)return notify('종료 시각은 시작 이후여야 합니다');requestBooking(f.get('song'),f.get('room'),start,end)}function approve(id){if(!isAdmin())return;let b=db.bookings.find(x=>x.id===id);if(roomBusy(b.room,b.start,b.end))return notify('확정 예약과 충돌합니다. 기존 예약을 취소한 뒤 승인하세요.');b.status='확정';save();render()}function reject(id){if(!isAdmin())return;db.bookings.find(x=>x.id===id).status='반려';save();render()}function cancel(id){let b=db.bookings.find(x=>x.id===id);if(b.owner!==db.current&&!isAdmin())return;b.status='취소';save();render()}
function admin(){if(!isAdmin())return '<p>접근 권한이 없습니다.</p>';return `<div class="grid"><div class="card"><h3>운영 현황</h3><div class="metric">${db.users.length}명</div><p class="muted">등록 부원</p></div><div class="card"><h3>예약 대기</h3><div class="metric">${db.bookings.filter(b=>b.status==='대기').length}건</div><button onclick="go('rooms')">예약 검토</button></div></div><div class="card"><h3>부원 등록</h3><form onsubmit="addUser(event)"><div class="three"><div class="field"><label>이름</label><input name="name" required maxlength="30"></div><div class="field"><label>조</label><select name="group"><option>1</option><option>2</option><option>3</option></select></div><div class="field"><label>주 세션</label><select name="part">${parts.map(p=>`<option>${p}</option>`).join('')}</select></div></div><button>부원 추가</button></form></div><div class="card"><h3>등록 부원</h3>${db.users.map(u=>`<div class="item">${esc(u.name)} · ${u.group}조 · ${esc(u.part)} · ${u.role==='admin'?'운영진':'부원'}</div>`).join('')}</div><div class="card"><h3>합주실 추가</h3><form onsubmit="addRoom(event)" class="row"><input name="name" placeholder="합주실 이름" required style="max-width:300px"><button>추가</button></form></div>`}function addUser(e){e.preventDefault();let f=new FormData(e.target);db.users.push({id:uid(),name:f.get('name').trim(),group:+f.get('group'),part:f.get('part'),role:'member'});save();render()}function addRoom(e){e.preventDefault();let n=new FormData(e.target).get('name').trim();db.rooms.push({id:uid(),name:n});save();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aerock-backup.json';a.click();URL.revokeObjectURL(a.href)}try{render()}catch(err){document.getElementById('content').innerHTML='<div class="card"><h3>실행 오류</h3><p>'+String(err.message).replace(/</g,'&lt;')+'</p><p>Safari의 HTTPS 웹주소에서 열어주세요.</p></div>';console.error(err)};
</script></body></html>
